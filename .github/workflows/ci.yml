# Sparing Horse — CI (revised-plan TECH-2).
#
# The gate that used to exist only on the owner's laptop and inside publish_mirror.sh. Two jobs, both
# on synthetic seed data: a real athlete's database never leaves the private box, so everything here
# runs against `SparingHorse.py seed`.
#
# The battery is deliberately run with the LLM scenarios OFF (they are opt-in behind SH_SELFTEST_LLM
# since TECH-1), so CI is free, deterministic, and does not depend on a model's mood.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: Self-test battery (seed DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'          # matches the Dockerfile's base image
          cache: pip
      # NOT --no-cache-dir: `cache: pip` above makes setup-python save ~/.cache/pip in a post-job
      # step, and that step ERRORS when the folder does not exist ("Cache folder path is
      # retrieved for pip but doesn't exist on disk"). Disabling the cache while declaring it
      # failed every run from the day CI landed, with every test step green — the worst shape a
      # broken gate can take, because it teaches you to read the red X as noise.
      # The same hash-pinned set the image installs (0.55.2): CI must not pass on a dependency
      # the container would then refuse.
      - run: pip install --require-hashes -r requirements.lock

      - name: Every module compiles
        run: |
          python -m py_compile SparingHorse.py sh_engine.py sh_selftest.py

      - name: The front end parses
        run: |
          # Only possible since TECH-11 moved the SPA out of a Python string literal: until then a
          # syntax error in 2,600 lines of application JavaScript could only be found by loading the
          # page in a browser and noticing that nothing worked.
          node --check static/app.js

      - name: Seed a synthetic database
        run: SH_DB="$RUNNER_TEMP/ci.db" python SparingHorse.py seed

      - name: Battery (LLM scenarios off by default)
        run: SH_DB="$RUNNER_TEMP/ci.db" python SparingHorse.py selftest

      - name: Battery, standalone entry point + JSON report
        run: |
          SH_DB="$RUNNER_TEMP/ci2.db" python SparingHorse.py seed
          python sh_selftest.py --db "$RUNNER_TEMP/ci2.db" --json "$RUNNER_TEMP/report.json"
          python -c "import json,sys; s=json.load(open('$RUNNER_TEMP/report.json'))['summary']; \
                     print(s); sys.exit(1 if s['failed'] else 0)"

      - name: Golden plans are the committed ones
        run: |
          SH_DB="$RUNNER_TEMP/g.db" python SparingHorse.py golden
          git diff --exit-code -- test/golden || {
            echo "::error::the engine's answers changed — update test/golden in the same commit and quote the diff"
            exit 1; }

      - name: Personal-data leak scan
        run: |
          # The pattern lives in publish_mirror.sh, which is PRIVATE-ONLY (the mirror excludes it) —
          # it names the owner's domain, town and NAS, so it must never be published. On the public
          # mirror the file is absent and this step is a no-op by design.
          if [ -f publish_mirror.sh ]; then
            LEAK_RE="$(sed -n "s/^LEAK_RE='\(.*\)'$/\1/p" publish_mirror.sh)"
            if [ -z "$LEAK_RE" ]; then echo "::error::could not read LEAK_RE"; exit 1; fi
            # Scan the tree that would actually be PUBLISHED. publish_mirror.sh strips these four
            # before it scans, and PROJECT_LOG.md is full of the owner's real context by design — a
            # scan that includes them fails every time and teaches everyone to ignore it.
            if git grep -nIiE "$LEAK_RE" -- . \
                 ':!PROJECT_LOG.md' ':!ENGINE_SCIENCE.md' ':!publish_mirror.sh' ':!.githooks'; then
              echo "::error::personal-data pattern found in the tree that would be published"; exit 1
            fi
            echo "clean"
          else
            echo "publish_mirror.sh absent (public mirror) — leak scan is a private-repo step"
          fi

  image:
    name: Container image (non-root, read-only, healthy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the image (digest-pinned base, hash-pinned wheels)
        run: docker build -t sparinghorse:ci .
      - name: Run it exactly as compose does and wait for healthy
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/secrets"
          docker run -d --name sh \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add DAC_OVERRIDE \
            --security-opt no-new-privileges:true --memory 512m \
            -e SH_DB=/data/sparinghorse.db -e SH_SECRETS_DB=/secrets/secrets.db \
            -v "$RUNNER_TEMP/data:/data" -v "$RUNNER_TEMP/secrets:/secrets" \
            sparinghorse:ci
          status=starting
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' sh)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs sh 2>&1 | tail -20
          [ "$status" = healthy ] || { echo "::error::the container never became healthy ($status)"; exit 1; }
      - name: The app runs unprivileged, on a read-only root, and owns its data
        run: |
          # PID 1 is the server after entrypoint.sh dropped privileges; `docker exec` itself is root.
          uid=$(docker exec sh sh -c "awk '/^Uid:/{print \$2}' /proc/1/status")
          echo "server uid: $uid"
          [ "$uid" = "10001" ] || { echo "::error::the server runs as uid $uid, not the app user"; exit 1; }
          docker exec sh sh -c 'touch /app/x' && { echo "::error::the root filesystem is writable"; exit 1; }
          owner=$(stat -c %u "$RUNNER_TEMP/data/sparinghorse.db")
          echo "database owner uid: $owner"
          [ "$owner" = "10001" ] || { echo "::error::the database is owned by uid $owner"; exit 1; }
          docker exec sh python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8770/healthz').read().decode())"
          h=$(docker exec sh python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8770/'); print(r.headers.get('Content-Security-Policy',''))")
          echo "$h" | grep -q "strict-dynamic" && ! echo "$h" | grep -q "unpkg" || { echo "::error::CSP is not the 0.55.2 policy: $h"; exit 1; }
          docker exec sh python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8770/static/vendor/leaflet-1.9.4/leaflet.js'); assert r.status==200 and len(r.read())>100000"
      - name: The console locks itself (0.56.0) — /api is 401 until a passphrase is set, then a session opens it
        run: |
          docker exec sh python - <<'PY'
          import urllib.request, urllib.error, urllib.parse
          base = "http://127.0.0.1:8770"
          def code(path, **kw):
              try:
                  return urllib.request.urlopen(urllib.request.Request(base + path, **kw)).status
              except urllib.error.HTTPError as e:
                  return e.code
          assert code("/api/plan") == 401, "fresh box served /api/plan without a passphrase"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k): return None
          opener = urllib.request.build_opener(NoRedirect)
          data = urllib.parse.urlencode({"passphrase": "ci passphrase for the image job", "confirm": "ci passphrase for the image job"}).encode()
          try:
              r = opener.open(urllib.request.Request(base + "/setup", data=data)); cookie = r.headers.get("Set-Cookie", "")
          except urllib.error.HTTPError as e:
              assert e.code == 302, f"/setup answered {e.code}"; cookie = e.headers.get("Set-Cookie", "")
          assert "sh_session=" in cookie and "HttpOnly" in cookie and "Secure" in cookie, f"cookie flags: {cookie}"
          sess = cookie.split(";")[0]
          assert code("/api/plan", headers={"Cookie": sess}) == 200, "the session cookie did not open /api/plan"
          assert code("/api/plan") == 401, "/api/plan is open without the cookie"
          print("auth: 401 → setup → 200 with the session cookie; flags:", cookie.split(";", 1)[1].strip())
          PY
      - if: always()
        run: docker rm -f sh >/dev/null 2>&1 || true

  browser:
    name: Browser flows (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      # The same hash-pinned set the image installs (0.55.2): CI must not pass on a dependency
      # the container would then refuse.
      - run: pip install --require-hashes -r requirements.lock
      - uses: actions/setup-node@v7
        with:
          # The Node the BROWSER TESTS run on — a different axis from the `node24` runtime the
          # actions themselves use, and not what the deprecation notice was about. 20 went
          # end-of-life in April 2026, so the gate was driving Playwright on an unsupported
          # runtime; 24 is the active LTS (until 2028-04-30) and 22 is already in maintenance.
          # It also puts the tests and the actions on the same major, which is one less thing
          # to reason about the next time a runtime moves under us.
          node-version: '24'
      - name: Install Playwright (chromium only)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Drive the real UI in 9 modes
        env:
          PY: python
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: ./test/run_local_test.sh
