# ── Hardening shared by all three services (0.55.2, review S4) ───────────────────────────────
# One block, merged into each service below. What each line buys:
#   read_only      the image's filesystem cannot be written at runtime — the app writes only to the
#                  mounted /data, /secrets and the tmpfs /tmp (self-test snapshots, backup staging)
#   cap_drop ALL   no Linux capability at all, except the four entrypoint.sh needs for its first
#   cap_add …      second: CHOWN (give the mounts to the app user), SETUID/SETGID (drop to it),
#                  DAC_OVERRIDE (traverse a mount whose files a previous run left owned by that user).
#                  After the drop the process holds none of them — see entrypoint.sh.
#   no-new-privileges  nothing exec'd from here can regain privileges via setuid binaries
#   mem_limit      the app sits at ~80 MB and the self-test child peaks at ~180 MB on a real-size
#                  database (measured 2026-09-02); 512 MB is 2× headroom, and a runaway is killed
#                  rather than taking the host with it
#   healthcheck    what `docker ps` shows as healthy/unhealthy — /healthz, which also carries the
#                  scheduler's failure count (the Dockerfile declares the same probe)
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - DAC_OVERRIDE
  security_opt:
    - no-new-privileges:true
  mem_limit: 512m
  healthcheck:
    test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8770/healthz', timeout=4).status == 200 else 1)"]
    interval: 30s
    timeout: 5s
    start_period: 20s
    retries: 3

services:
  # ── Private — full read/write, behind Cloudflare Access (only the owner) ──────
  sparinghorse:
    <<: *hardening
    build: .
    image: sparinghorse:local
    container_name: sparinghorse
    restart: unless-stopped
    environment:
      # Secrets (Runalyze token + Claude key) are OPTIONAL here — you can set them in the private
      # Settings window instead (stored in ./secrets below, applied live, no restart). These env vars
      # are a fallback/bootstrap; a value set in the window overrides them.
      # Runalyze Personal API token (Premium): https://runalyze.com/settings/personal-api
      - RUNALYZE_TOKEN=${RUNALYZE_TOKEN:-}
      # The LLM adjustment layer (the plan engine's language/judgment).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SH_DB=/data/sparinghorse.db
      # Private-only secrets store — keys set in the Settings window land here, NOT in ./data (which
      # the public container shares + can read). This volume is mounted ONLY on this private service.
      - SH_SECRETS_DB=/secrets/secrets.db
      # Personalization — real values live in the git-ignored .env on the host, kept OUT of this
      # tracked file so the public mirror + publish_mirror.sh leak gate stay clean.
      # Header widgets (also set on the public container so they render there too):
      - SH_WEATHER_CITIES=${SH_WEATHER_CITIES:-}
      - SH_HOUSE_URL=${SH_HOUSE_URL:-}
      - SH_HOUSE_NAME=${SH_HOUSE_NAME:-}
      # §TZ — SH_TZ IS THE WHOLE ENGINE'S CLOCK, not just the nightly job's. Unset, every date the app
      # reads is the CONTAINER's, and these containers run UTC — so from local midnight until the
      # container's, the engine believes it is yesterday while activity rows carry Runalyze's LOCAL
      # date. Set it to where you train. ⛔ Do NOT "fix" this with a plain `TZ=` here instead: glibc's
      # tzset() reads /usr/share/zoneinfo, which python:slim does not ship (see requirements.txt), and
      # an unloadable zone does not fail — it runs on UTC silently. The app resolves the zone itself,
      # borrowing the tzdata wheel's database, and REFUSES rather than pretend (det/one-clock).
      # Private-only: timezone + nightly-sync hour, LLM athlete context, fresh-DB seed objective.
      # SH_SYNC_AT (HH:MM in SH_TZ, default 22:00) must land AFTER the day's last run has been
      # ingested upstream — the nightly job syncs and then re-plans, so a job that fires while a run
      # is still landing re-plans a week whose actuals it cannot see. §PRO20 removed the SEED's
      # dependence on this (the seed is end-of-yesterday, whenever it is read), but `week_actuals`
      # still reads the day. This pass-through was MISSING: the value was set in .env and never
      # reached the container, so the hardcoded 22:00 default ran regardless — which on
      # Europe/Luxembourg is 20:00Z, exactly when every scheduled plan in his history is stamped.
      # ⚠ An env change needs a container RECREATE (`docker compose up -d`), not just a rebuild.
      - SH_TZ=${SH_TZ:-}
      - SH_SYNC_AT=${SH_SYNC_AT:-}
      - SH_ATHLETE_CONTEXT=${SH_ATHLETE_CONTEXT:-}
      - SH_SEED_OBJECTIVE=${SH_SEED_OBJECTIVE:-}
      # "More info" link on pushed Suunto guides (default: the project repo).
      - SH_GUIDE_URL=${SH_GUIDE_URL:-}
    volumes:
      # Locally-owned data copy lives on the NAS — back it up by copying this folder.
      # This is the single writer of the DB. Since 0.55.2 the files in it are owned by the app
      # user (uid 10001 by default, SH_UID/SH_GID to change) — entrypoint.sh chowns the mount on
      # every start, so a root-created folder keeps working.
      - ./data:/data
      # Private-only key store (Runalyze token / Claude key set in the Settings window). Deliberately
      # NOT under ./data and NOT mounted on the public container — keeps secrets off the open box.
      - ./secrets:/secrets
    networks:
      - edge
    # NO host-published port. This instance has the tokens + medical data and NO app-level auth —
    # it trusts Cloudflare Access entirely, so it must be unreachable except through the tunnel.
    # cloudflared reaches it by service name (http://sparinghorse:8770) over the shared `edge`
    # network. For host-local debugging only, bind to loopback (never 0.0.0.0):
    #   ports: ["127.0.0.1:8770:8770"]

  # ── Public — always-open, read-only showcase (no Access) ─────────────────────
  # Same image, same DB, but SH_READONLY blocks every mutation + the medical sections,
  # the connection is query_only, and there are NO tokens — so it cannot sync, call the
  # LLM, or write, even if something tried. It just renders the latest shape + plan.
  sparinghorse-public:
    <<: *hardening
    image: sparinghorse:local
    container_name: sparinghorse-public
    restart: unless-stopped
    depends_on:
      - sparinghorse        # ensures the image is built and the DB exists first
    environment:
      - SH_READONLY=1
      - SH_DB=/data/sparinghorse.db
      # - SH_PRIVATE_URL=https://private.example.com   # optional "Log in" link → your private console
      # deliberately NO RUNALYZE_TOKEN / ANTHROPIC_API_KEY here
      # Header widgets — public-visible by design (weather is 3 decoy capitals; real workout geo is
      # GPS-map-only and private). Real values from the host .env; no personal data in this file.
      - SH_WEATHER_CITIES=${SH_WEATHER_CITIES:-}
      - SH_HOUSE_URL=${SH_HOUSE_URL:-}
      - SH_HOUSE_NAME=${SH_HOUSE_NAME:-}
    volumes:
      # Same DB. NOT mounted :ro — SQLite WAL readers need to touch -wal/-shm; the
      # query_only PRAGMA + the request guard are the write barrier instead.
      - ./data:/data
    networks:
      - edge
    # Reached by the tunnel via service name (http://sparinghorse-public:8770) over `edge`.
    # Host-local debug only: ports: ["127.0.0.1:8771:8770"]

  # ── Demo — the FULL private console over a SYNTHETIC athlete, open to anyone ─
  # This is not the public read-only view: it is the private console, complete, so a stranger can
  # regenerate the plan, post a check-in, move the race and watch the engine actually respond. The
  # data belongs to nobody — `SH_DEMO=1` seeds a synthetic athlete into its OWN database on first
  # boot and restores it every hour, so whatever a visitor leaves behind is temporary.
  #
  # ⚠ ITS OWN VOLUME. `./demo:/data` — NOT the shared `./data`. The demo must never be able to read
  # or write the real database, and no barrier inside the app is as good as not mounting the file.
  # ⚠ NO SECRETS, NO SECRETS VOLUME. No Runalyze token, no Claude key, and deliberately no
  # `SH_SECRETS_DB` mount: a public box should hold no credential, and `_demo_guard` also refuses
  # `POST /api/secrets` so a visitor cannot paste one in. The plan explainer serves a narration
  # baked beforehand with `SparingHorse.py demo-bake` (stored in the demo DB), flagged as a sample.
  sparinghorse-demo:
    <<: *hardening
    image: sparinghorse:local
    container_name: sparinghorse-demo
    restart: unless-stopped
    depends_on:
      - sparinghorse        # ensures the image is built first
    environment:
      - SH_DEMO=1
      - SH_DB=/data/sparinghorse.db
      # The demo holds no secret and refuses to accept one, but the Settings panel's status read
      # opens the store file to answer "not configured" — on a read-only root filesystem that open
      # must land on the tmpfs, not in /app (0.55.2).
      - SH_SECRETS_DB=/tmp/secrets.db
      # How often the synthetic athlete is restored. Lower it if the demo gets busy.
      - SH_DEMO_RESET_EVERY_S=3600
      # Give the demo the same clock as the rest of the stack, or its "today" is UTC and the
      # straddling week reads a day out. See the §TZ note on the private service.
      - SH_TZ=${SH_TZ:-}
      # Header widgets, so the demo looks like the real thing rather than a stripped fixture.
      - SH_WEATHER_CITIES=${SH_WEATHER_CITIES:-}
      # deliberately NO RUNALYZE_TOKEN / ANTHROPIC_API_KEY / SH_SECRETS_DB / SH_HOUSE_* here —
      # a demo carries no credentials and does not advertise the owner's other sites.
    volumes:
      # A NAMED VOLUME, not a bind mount, and deliberately: Docker creates it on first use, whereas a
      # missing bind-mount source is a hard failure on some hosts ("Bind mount failed: … does not
      # exist" on Synology) — so `./demo:/data` turned a one-line deploy into a mkdir-in-the-right-
      # directory puzzle. Nothing is lost by it: this database is synthetic, seeded on first boot and
      # restored hourly, so there is no host file anyone needs to keep, back up or inspect. It is also
      # one more reason the demo cannot reach the real data — it has no path into ./data at all.
      # Wipe it, if ever needed, with:  docker compose down && docker volume rm sparinghorse_demo-data
      - demo-data:/data
    networks:
      - edge
    # Reached by the tunnel via service name (http://sparinghorse-demo:8770) over `edge`.
    # Host-local debug only: ports: ["127.0.0.1:8772:8770"]

volumes:
  demo-data:      # the demo's synthetic database — disposable by design (see the service above)

# Shared network for the Cloudflare tunnel to reach both instances by service name. cloudflared
# (its own stack, currently on the default `bridge`) must join this same network — see the deploy
# runbook. Naming it explicitly keeps the name stable regardless of the compose project/dir name.
networks:
  edge:
    name: sparinghorse-edge
